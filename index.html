      </div>

</div>

<div class="modal" id="adminModal">
  <div class="modal-box" style="width:min(1100px,100%)">
    <div class="modal-header">
      <div>
        <div class="eyebrow">Internal Dashboard</div>
        <h2>Dashboard Admin</h2>
      </div>
      <button class="close" data-close="adminModal">×</button>
    </div>

    <div class="admin-top">

      <div class="form-actions" style="margin-top:0">
        <button class="btn btn-primary btn-small" id="refreshAdmin">
          Refresh

        <button class="btn btn-danger btn-small" id="logoutAdmin">

    <div class="admin-stats">

            <th>Wilayah</th>

            <th>Status</th>
            <th>Aksi</th>

        <tbody id="adminTableBody"></tbody>

  </div>
</div>

<div class="modal" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="eyebrow">Kelola Peserta</div>
        <h2>Perbarui Status</h2>
      </div>
      <button class="close" data-close="editModal">×</button>
    </div>

    <div id="editNotice"></div>

    <form id="editForm">
      <input type="hidden" id="editId">

      <div class="field">
        <label for="editStatus">Status Pendaftaran</label>

        <select id="editStatus" required>
          <option>Menunggu Verifikasi</option>
          <option>Perlu Perbaikan</option>
          <option>Terverifikasi</option>
          <option>Ditolak</option>
          <option>Lolos</option>
          <option>Tidak Lolos</option>
        </select>
      </div>

      <div class="field" style="margin-top:14px">
        <label for="editDocumentStatus">Status Dokumen</label>

        <select id="editDocumentStatus" required>
          <option>Belum Diverifikasi</option>
          <option>Sedang Diverifikasi</option>
          <option>Disetujui</option>
          <option>Perlu Perbaikan</option>
          <option>Ditolak</option>
        </select>
      </div>

      <div class="field" style="margin-top:14px">
        <label for="editInterview">Jadwal Interview</label>
        <input
          id="editInterview"
          placeholder="Contoh: 10 Oktober 2026, 19.00 WITA"

      <div class="field" style="margin-top:14px">

        <select id="editMethod">

          <option>Online</option>

      <div class="field" style="margin-top:14px">

        <input id="editLocation" placeholder="Kosongkan jika online">

      <div class="field" style="margin-top:14px">
        <label for="editNote">Catatan Admin</label>
        <textarea
          id="editNote"
          placeholder="Catatan untuk peserta"
        ></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL =
  "https://qccenzvpncfkkbncfnkh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_iN8EDDpe6JwELDU7GiWifw_5rFBZHr1";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);

let pendingRegistration = null;
let lastRegisteredCode = "";
let adminParticipants = [];

const questions = [
  "Apa alasan utama kamu ingin bergabung dengan Muda Bergerak?",
  "Ketika menemukan masalah di lingkungan sekitar, apa yang kamu lakukan?",
  "Bagaimana cara kamu bekerja dalam tim yang memiliki perbedaan pendapat?",
  "Apa arti transparansi dalam sebuah organisasi?",
  "Apa peran anak muda dalam masyarakat?",
  "Jika diberi tanggung jawab, bagaimana kamu menyelesaikannya?",
  "Apa yang kamu lakukan ketika rencana kegiatan tidak berjalan sesuai harapan?",
  "Bagaimana kamu menerima kritik dari anggota lain?",
  "Apa bentuk kontribusi yang bisa kamu berikan?",
  "Apa harapanmu setelah bergabung dengan Muda Bergerak?"
];

const options = [
  [
    "Menunggu arahan",
    "Mengamati saja",
    "Mengajak berdiskusi",
    "Mengambil langkah dan mengajak kolaborasi"
  ],
  [
    "Mengabaikan",
    "Menyalahkan pihak lain",
    "Membahas dengan orang terdekat",
    "Mencari solusi bersama"
  ],
  [
    "Memaksakan pendapat",
    "Menghindari diskusi",
    "Mendengarkan dan berdiskusi",
    "Mencari keputusan bersama secara terbuka"
  ],
  [
    "Menyembunyikan informasi",
    "Memberi informasi sebagian",
    "Memberi informasi jika diminta",
    "Menyampaikan informasi secara jujur dan bertanggung jawab"
  ],
  [
    "Hanya sebagai penonton",
    "Mengikuti tren",
    "Memberi pendapat",
    "Berpartisipasi dan menciptakan dampak"
  ],
  [
    "Menunda",
    "Menyerahkan kepada orang lain",
    "Mengerjakan jika diingatkan",
    "Menyusun langkah dan menyelesaikan tepat waktu"
  ],
  [
    "Menyerah",
    "Menyalahkan keadaan",
    "Mengubah sebagian rencana",
    "Mengevaluasi dan menyusun solusi alternatif"
  ],
  [
    "Menolak",
    "Diam dan menjauh",
    "Menerima sebagian",
    "Mendengarkan dan menggunakan kritik untuk berkembang"
  ],
  [
    "Hanya hadir",
    "Membagikan informasi",
    "Membantu jika diminta",
    "Aktif sesuai kemampuan dan kebutuhan organisasi"
  ],
  [
    "Mendapatkan jabatan",
    "Mendapatkan relasi saja",
    "Belajar pengalaman baru",
    "Belajar, berkembang, dan memberi kontribusi"
  ]
];

function openModal(id) {
  $(id).classList.add("show");
  document.body.classList.add("modal-open");
}

function closeModal(id) {
  $(id).classList.remove("show");

  if (!document.querySelector(".modal.show")) {
    document.body.classList.remove("modal-open");
  }
}

function notice(id, message, type = "info") {
  $(id).innerHTML = message
    ? `<div class="notice ${type}">${escapeHTML(message)}</div>`
    : "";
}

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function makeCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let output = "MB26-";

  for (let i = 0; i < 6; i++) {
    output += chars[Math.floor(Math.random() * chars.length)];
  }

  return output;
}

function fileName(id) {
  return $(id).files?.[0]?.name || "";
}

function renderQuestions() {
  $("quizQuestions").innerHTML = questions
    .map((question, index) => {
      return `
        <div class="quiz-question">
          <p>${index + 1}. ${escapeHTML(question)}</p>

          <div class="quiz-options">
            ${options[index]
              .map((option, optionIndex) => {
                const score = [1, 4, 7, 10][optionIndex];

                return `
                  <label>
                    <input
                      type="radio"
                      name="q${index}"
                      value="${score}"
                      required
                    >
                    <span>${escapeHTML(option)}</span>
                  </label>
                `;
              })
              .join("")}
          </div>
        </div>
      `;
    })
    .join("");
}

function validateStructureAndRegion() {
  const structure = $("struktur").value;
  const region = $("wilayah").value;

  if (structure === "DPW" && region !== "Makassar") {
    notice(
      "registerNotice",
      "Pendaftar DPW wajib berdomisili di Kota Makassar.",
      "error"
    );

    return false;
  }

  return true;
}

function scoreQuiz(form) {
  let total = 0;

  for (let i = 0; i < questions.length; i++) {
    const selected = form.querySelector(
      `input[name="q${i}"]:checked`
    );

    if (!selected) return null;

    total += Number(selected.value);
  }

  return total;
}

async function submitRegistration() {
  notice(
    "quizNotice",
    "Mengirim data ke database...",
    "info"
  );

  const code = makeCode();

  const payload = {
    kode_peserta: code,
    nama_lengkap: pendingRegistration.nama,
    nomor_whatsapp: pendingRegistration.whatsapp,
    email: pendingRegistration.email,
    tanggal_lahir: pendingRegistration.tanggal_lahir,
    pendidikan_pekerjaan: pendingRegistration.pendidikan,
    struktur_pilihan: pendingRegistration.struktur,
    wilayah_domisili: pendingRegistration.wilayah,
    pengalaman_organisasi: pendingRegistration.pengalaman,
    motivasi: pendingRegistration.motivasi,
    skor_quiz: pendingRegistration.skor,
    persetujuan_data: true
  };

  const { error } = await db
    .from("pendaftar")
    .insert(payload);

  if (error) {
    console.error(error);

    notice(
      "quizNotice",
      "Pendaftaran gagal: " + error.message,
      "error"
    );

    return;
  }

  lastRegisteredCode = code;

  closeModal("quizModal");

  $("successCode").textContent = code;

  $("successScore").textContent =
    `Skor quiz kamu: ${pendingRegistration.skor}/100`;

  openModal("successModal");

  $("registerForm").reset();
  $("quizForm").reset();

  pendingRegistration = null;
}

async function checkStatus(code) {
  notice(
    "statusNotice",
    "Memeriksa data...",
    "info"
  );

  $("statusResult").innerHTML = "";

  const { data, error } = await db.rpc(
    "cek_status_peserta",
    {
      p_kode: code.trim().toUpperCase()
    }
  );

  if (error) {
    notice("statusNotice", error.message, "error");
    return;
  }

  if (!data || data.length === 0) {
    notice(
      "statusNotice",
      "Kode peserta tidak ditemukan.",
      "error"
    );

    return;
  }

  const p = data[0];

  notice(
    "statusNotice",
    "Data peserta ditemukan.",
    "success"
  );

  $("statusResult").innerHTML = `
    <div class="card" style="margin-top:15px">
      <div class="number">DATA PESERTA</div>

      <h3>${escapeHTML(p.nama_lengkap)}</h3>

      <p>Kode: ${escapeHTML(p.kode_peserta)}</p>
      <p>Struktur: ${escapeHTML(p.struktur_pilihan)}</p>
      <p>Wilayah: ${escapeHTML(p.wilayah_domisili)}</p>
      <p>Skor Quiz: ${escapeHTML(p.skor_quiz)}</p>

      <p>
        Status Pendaftaran:
        <b>${escapeHTML(p.status_pendaftaran)}</b>
      </p>

      <p>
        Status Dokumen:
        <b>${escapeHTML(p.status_dokumen)}</b>
      </p>

      <p>
        Jadwal Interview:
        ${escapeHTML(p.jadwal_interview || "Belum ditentukan")}
      </p>

      <p>
        Metode:
        ${escapeHTML(p.metode_interview || "Belum ditentukan")}
      </p>

      <p>
        Lokasi:
        ${escapeHTML(p.lokasi_interview || "Belum ditentukan")}
      </p>

      <p>
        Catatan Admin:
        ${escapeHTML(p.catatan_admin || "Belum ada catatan")}
      </p>
    </div>
  `;
}

function statusClass(status) {
  if (
    ["Terverifikasi", "Disetujui", "Lolos"].includes(status)
  ) {
    return "green";
  }

  if (
    ["Perlu Perbaikan", "Sedang Diverifikasi"].includes(status)
  ) {
    return "yellow";
  }

  if (
    ["Ditolak", "Tidak Lolos"].includes(status)
  ) {
    return "red";
  }

  return "";
}

function renderAdminTable() {
  $("adminTableBody").innerHTML = adminParticipants
    .map((p) => {
      return `
        <tr>
          <td>${escapeHTML(p.kode_peserta)}</td>
          <td>${escapeHTML(p.nama_lengkap)}</td>
          <td>${escapeHTML(p.struktur_pilihan)}</td>
          <td>${escapeHTML(p.wilayah_domisili)}</td>
          <td>${escapeHTML(p.skor_quiz)}</td>

          <td>
            <span class="status-pill ${statusClass(
              p.status_pendaftaran
            )}">
              ${escapeHTML(p.status_pendaftaran)}
            </span>
          </td>

          <td>
            <button
              class="btn btn-primary btn-small"
              onclick="openEdit('${p.id}')"
            >
              Kelola
            </button>
          </td>
        </tr>
      `;
    })
    .join("");

  $("statTotal").textContent = adminParticipants.length;

  $("statPending").textContent =
    adminParticipants.filter(
      (p) => p.status_pendaftaran === "Menunggu Verifikasi"
    ).length;

  $("statVerified").textContent =
    adminParticipants.filter(
      (p) => p.status_pendaftaran === "Terverifikasi"
    ).length;
}

async function loadAdminParticipants() {
  notice(
    "adminNotice",
    "Memuat data peserta...",
    "info"
  );

  const { data, error } = await db
    .from("pendaftar")
    .select("*")
    .order("created_at", {
      ascending: false
    });

  if (error) {
    notice("adminNotice", error.message, "error");
    return;
  }

  adminParticipants = data || [];

  renderAdminTable();

  notice(
    "adminNotice",
    "Data peserta berhasil dimuat.",
    "success"
  );
}

async function openAdmin() {
  const {
    data: { session }
  } = await db.auth.getSession();

  if (!session) {
    openModal("adminLoginModal");
    return;
  }

  openModal("adminModal");

  await loadAdminParticipants();
}

window.openEdit = function (id) {
  const p = adminParticipants.find(
    (item) => item.id === id
  );

  if (!p) return;

  $("editId").value = p.id;

  $("editStatus").value =
    p.status_pendaftaran || "Menunggu Verifikasi";

  $("editDocumentStatus").value =
    p.status_dokumen || "Belum Diverifikasi";

  $("editInterview").value =
    p.jadwal_interview || "";

  $("editMethod").value =
    p.metode_interview || "";

  $("editLocation").value =
    p.lokasi_interview || "";

  $("editNote").value =
    p.catatan_admin || "";

  notice("editNotice", "");

  openModal("editModal");
};

$("registerForm").addEventListener(
  "submit",
  (event) => {
    event.preventDefault();

    if (!validateStructureAndRegion()) return;

    pendingRegistration = {
      nama: $("nama").value.trim(),
      whatsapp: $("whatsapp").value.trim(),
      email: $("email").value.trim(),
      tanggal_lahir: $("tanggalLahir").value,
      pendidikan: $("pendidikan").value.trim(),
      struktur: $("struktur").value,
      wilayah: $("wilayah").value,
      pengalaman: $("pengalaman").value.trim(),
      motivasi: $("motivasi").value.trim(),
      ktp: fileName("ktp"),
      cv: fileName("cv"),
      foto: fileName("foto")
    };

    closeModal("registerModal");

    renderQuestions();

    notice("quizNotice", "");

    openModal("quizModal");
  }
);

$("quizForm").addEventListener(
  "submit",
  (event) => {
    event.preventDefault();

    const score = scoreQuiz(event.target);

    if (score === null) {
      notice(
        "quizNotice",
        "Jawab seluruh pertanyaan terlebih dahulu.",
        "error"
      );

      return;
    }

    pendingRegistration.skor = score;

    submitRegistration();
  }
);

$("statusForm").addEventListener(
  "submit",
  (event) => {
    event.preventDefault();

    checkStatus($("statusCode").value);
  }
);

$("adminLoginForm").addEventListener(
  "submit",
  async (event) => {
    event.preventDefault();

    notice(
      "adminLoginNotice",
      "Memproses login...",
      "info"
    );

    const { error } = await db.auth.signInWithPassword({
      email: $("adminEmail").value.trim(),
      password: $("adminPassword").value
    });

    if (error) {
      notice(
        "adminLoginNotice",
        error.message,
        "error"
      );

      return;
    }

    closeModal("adminLoginModal");

    $("adminLoginForm").reset();

    await openAdmin();
  }
);

$("editForm").addEventListener(
  "submit",
  async (event) => {
    event.preventDefault();

    const id = $("editId").value;

    const update = {
      status_pendaftaran: $("editStatus").value,
      status_dokumen: $("editDocumentStatus").value,
      jadwal_interview:
        $("editInterview").value.trim() || null,
      metode_interview:
        $("editMethod").value || null,
      lokasi_interview:
        $("editLocation").value.trim() || null,
      catatan_admin:
        $("editNote").value.trim() || null,
      updated_at: new Date().toISOString()
    };

    const { error } = await db
      .from("pendaftar")
      .update(update)
      .eq("id", id);

    if (error) {
      notice(
        "editNotice",
        error.message,
        "error"
      );

      return;
    }

    closeModal("editModal");

    await loadAdminParticipants();

    notice(
      "adminNotice",
      "Perubahan peserta berhasil disimpan.",
      "success"
    );
  }
);

$("refreshAdmin").addEventListener(
  "click",
  loadAdminParticipants
);

$("logoutAdmin").addEventListener(
  "click",
  async () => {
    await db.auth.signOut();

    closeModal("adminModal");

    alert("Admin berhasil logout.");
  }
);

$("heroRegister").addEventListener(
  "click",
  () => {
    notice("registerNotice", "");
    openModal("registerModal");
  }
);

$("ctaRegister").addEventListener(
  "click",
  () => {
    notice("registerNotice", "");
    openModal("registerModal");
  }
);

$("registerNav").addEventListener(
  "click",
  (event) => {
    event.preventDefault();

    notice("registerNotice", "");

    openModal("registerModal");
  }
);

function openStatus() {
  notice("statusNotice", "");

  $("statusResult").innerHTML = "";

  openModal("statusModal");
}

$("statusNav").addEventListener(
  "click",
  (event) => {
    event.preventDefault();

    openStatus();
  }
);

$("ctaStatus").addEventListener(
  "click",
  openStatus
);

$("successStatus").addEventListener(
  "click",
  () => {
    closeModal("successModal");

    $("statusCode").value = lastRegisteredCode;

    openStatus();

    checkStatus(lastRegisteredCode);
  }
);

document
  .querySelectorAll("[data-close]")
  .forEach((button) => {
    button.addEventListener(
      "click",
      () => {
        closeModal(button.dataset.close);
      }
    );
  });

document
  .querySelectorAll(".modal")
  .forEach((modal) => {
    modal.addEventListener(
      "click",
      (event) => {
        if (event.target === modal) {
          closeModal(modal.id);
        }
      }
    );
  });

document.addEventListener(
  "keydown",
  (event) => {
    if (event.key === "Escape") {
      document
        .querySelectorAll(".modal.show")
        .forEach((modal) => {
          closeModal(modal.id);
        });
    }
  }
);

document.addEventListener(
  "contextmenu",
  (event) => {
    if (event.target.tagName === "IMG") {
      event.preventDefault();
    }
  }
);

db.auth.onAuthStateChange(
  (event, session) => {
    console.log(
      "Auth event:",
      event,
      Boolean(session)
    );
  }
);

// Akses dashboard admin melalui: index.html#admin
if (location.hash === "#admin") {
  setTimeout(openAdmin, 500);
}
</script>
